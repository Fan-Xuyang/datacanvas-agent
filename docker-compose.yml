services:
  app:
    build: .
    ports:
      - "127.0.0.1:${DATACANVAS_PORT:-8203}:8201"
    environment:
      APP_DATA_DIR: /app/data
      APP_HOST: 0.0.0.0
      DATACANVAS_AUTH_REQUIRED: ${DATACANVAS_AUTH_REQUIRED:-false}
      DATACANVAS_TOKENS: ${DATACANVAS_TOKENS:-}
      OCR_ENABLED: "true"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_BASE_URL: ${AI_EMBEDDING_BASE_URL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-datacanvas}
      RERANKER_URL: ${RERANKER_URL:-}
      RERANKER_API_KEY: ${RERANKER_API_KEY:-}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
    volumes:
      - datacanvas-data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    expose:
      - "6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  datacanvas-data:
  qdrant-data:
